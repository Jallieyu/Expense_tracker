<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#fff7fa" />
  <title>Money Archive</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="auth" class="auth-shell hidden" aria-label="로그인">
    <div class="auth-card">
      <div class="brand"><span class="brand-icon">🎀</span><span>Money Archive</span></div>
      <div class="eyebrow">YOUR LITTLE FINANCE DIARY</div><h1>나만의 소중한 기록 🌷</h1>
      <p class="muted">차곡차곡 모아온 나의 하루와 돈을 만나러 가요.</p>
      <form id="login-form" class="form-stack">
        <label>이메일<input id="login-email" type="email" required autocomplete="username" placeholder="name@example.com" /></label>
        <label>비밀번호<input id="login-password" type="password" required autocomplete="current-password" placeholder="비밀번호" /></label>
        <button class="btn primary" type="submit">로그인</button>
      </form>
      <p class="tiny muted auth-bottom">🔒 나만 들어올 수 있는 비공개 공간이에요.</p>
    </div>
  </section>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">🎀</span><span>Money Archive</span></div>
      <div class="nav-heading">MY LITTLE SPACE</div>
      <nav id="sidebar-nav" aria-label="주요 메뉴">
        <button class="nav active" data-page="dashboard"><span>🏠</span> 대시보드</button>
        <button class="nav" data-page="accounts"><span>💰</span> 나의 자산</button>
        <button class="nav" data-page="portfolio"><span>📈</span> 주식·ETF</button>
        <button class="nav" data-page="envelopes"><span>🧧</span> 현금바인더</button>
        <button class="nav" data-page="transactions"><span>🧾</span> 거래내역</button>
        <button class="nav" data-page="wishlist"><span>🎁</span> 위시리스트</button>
        <button class="nav" data-page="reports"><span>📊</span> 리포트</button>
        <button class="nav" data-page="settings"><span>⚙️</span> 설정</button>
      </nav>
      <div class="sidebar-foot"><div class="profile-avatar">🌸</div><div class="profile-info"><strong>나만의 아카이브</strong><small id="user-email">로그인됨</small></div><button class="icon-btn" id="logout" title="로그아웃" aria-label="로그아웃">↪</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><p class="eyebrow" id="page-crumb">OVERVIEW</p><h1 id="page-heading">대시보드</h1></div><div class="top-actions"><span id="today-label" class="muted hide-mobile"></span><button class="btn light" data-modal="salary">💌 월급</button><button class="btn primary" data-modal="expense">✏️ 지출 기록</button></div></header>
      <div id="content" aria-live="polite"></div>
      <footer>Made with ♡ · Money Archive</footer>
    </main>
  </div>
  <div id="modal-layer" class="modal-layer hidden" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><p class="eyebrow">NEW RECORD</p><h2 id="modal-title"></h2></div><button class="icon-btn" id="modal-close" aria-label="닫기">✕</button></div><form id="action-form" class="form-stack"></form></div></div>
</body>
</html>
